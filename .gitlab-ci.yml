# =========================================================================
# 🏆 IMMUTABLE GITOPS PIPELINE: CONTAINERIZED OPENTOFU & CONTAINERIZED ANSIBLE
# =========================================================================

stages:
  - plan
  - apply
  - configure  # Application-level deployment via ephemeral container execution

variables:
  TOFU_IMAGE: "ghcr.io/opentofu/opentofu:1.8.4"
  ANSIBLE_IMAGE: "://redhat.com"
  STATE_DIR: "/var/lib/gitlab-runner/share/tofu-state"
  SECURE_TFVARS: "/var/lib/gitlab-runner/secure-vars/production.tfvars"
  VAULT_PASS_FILE: "/var/lib/gitlab-runner/secure-vars/vault-password.txt"

# ➔ Global infrastructure prerequisites template
.tofu_base:
  tags:
    - image-builder # Targets your dedicated RHEL 9.8 VM Runner
  before_script:
    - sudo mkdir -p "${STATE_DIR}"
    - sudo chown -R gitlab-runner:gitlab-runner "${STATE_DIR}"
    - |
      if [ ! -f "${SECURE_TFVARS}" ]; then
        echo "CRITICAL ERROR: Local secure variables file ${SECURE_TFVARS} missing on Runner disk!"
        exit 1
      fi
  # ➔ FIXED: RESTORE FILESYSTEM OWNERSHIP TO PREVENT PERMISSION DENIED ON NEXT RUNS
  after_script:
    - echo "=== CLEANUP: Restoring workspace files permissions to gitlab-runner ==="
    - sudo chown -R gitlab-runner:gitlab-runner "${CI_PROJECT_DIR}"

# =========================================================================
# 🔍 STSTAGE 1: OPENTOFU ORCHESTRATION PLAN
# =========================================================================
tofu_plan:
  stage: plan
  extends: .tofu_base
  script:
    - 'echo "=== 1. INITIALIZING OPENTOFU ENVIRONMENT ==="'
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -w /workspace \
        ${TOFU_IMAGE} init

    - 'echo "=== 2. GENERATING INFRASTRUCTURE STATE MAP ==="'
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -v "${SECURE_TFVARS}":/workspace/terraform.tfvars:z \
        -w /workspace \
        ${TOFU_IMAGE} plan -out=tofu.plan
  artifacts:
    paths:
      - tofu.plan
      - .terraform.lock.hcl
    expire_in: 1 hour

# =========================================================================
# 🚀 STSTAGE 2: OPENTOFU INFRASTRUCTURE DEPLOYMENT (STATELESS)
# =========================================================================
tofu_apply:
  stage: apply
  extends: .tofu_base
  dependencies:
    - tofu_plan
  script:
    - 'echo "=== 3. EXECUTING PROXMOX INSTANCE PROVISIONING ==="'
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -v "${SECURE_TFVARS}":/workspace/terraform.tfvars:z \
        -w /workspace \
        ${TOFU_IMAGE} apply -auto-approve tofu.plan
  artifacts:
    paths:
      # ➔ Pass the dynamic inventory file as an artifact to the Ansible stage
      - ansible-inventory/hosts.ini
    expire_in: 1 hour
  only:
    - main
  when: manual # Explicit human approval gate for production changes

# =========================================================================
# 🤖 STSTAGE 3: CONTAINERIZED ANSIBLE PROVISIONING (PURE SECOPS ISOLATION)
# =========================================================================
ansible_configure:
  stage: configure
  tags:
    - image-builder # Inherits native network SSH access from Runner shell
  dependencies:
    - tofu_apply # Inherits the hosts.ini file generated during apply
  needs:
    - tofu_apply # Hard gate checkpoint to enforce sequential ordering
  before_script:
    - |
      if [ ! -f "${VAULT_PASS_FILE}" ]; then
        echo "CRITICAL ERROR: Isolated Ansible Vault password file ${VAULT_PASS_FILE} missing on Runner disk!"
        exit 1
      fi
      if [ ! -f "ansible-inventory/hosts.ini" ]; then
        echo "CRITICAL ERROR: Dynamic inventory hosts.ini artifact missing from OpenTofu stage!"
        exit 1
      fi
  script:
    - 'echo "=== 4. LAUNCHING CONTAINERIZED ANSIBLE CONFIGURATION ==="'
    # ➔ RUNNING ANSIBLE INSIDE AN EPHEMERAL OFFICIAL RED HAT CONTAINER
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${VAULT_PASS_FILE}":/vault-password.txt:z \
        -w /workspace/ansible-openbao \
        ${ANSIBLE_IMAGE} \
        ansible-playbook -i ../ansible-inventory/hosts.ini site.yml --vault-password-file /vault-password.txt
  # ➔ FIXED: RESTORE FILESYSTEM OWNERSHIP AFTER ANSIBLE INTERNALS MUTATIONS
  after_script:
    - echo "=== CLEANUP:Restoring workspace files permissions to gitlab-runner ==="
    - sudo chown -R gitlab-runner:gitlab-runner "${CI_PROJECT_DIR}"
  only:
    - main
