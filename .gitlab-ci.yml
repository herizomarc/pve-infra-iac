# =========================================================================
# GITOPS PIPELINE: OPENTOFU (IAAS) + ANSIBLE VAULT (CONFIG)
# =========================================================================

stages:
  - plan
  - apply
  - configure  

variables:
  TOFU_IMAGE: "ghcr.io/opentofu/opentofu:1.8.4"
  STATE_DIR: "/var/lib/gitlab-runner/share/tofu-state"
  SECURE_TFVARS: "/var/lib/gitlab-runner/secure-vars/production.tfvars"
  VAULT_PASS_FILE: "/var/lib/gitlab-runner/secure-vars/vault-password.txt"


.tofu_base:
  tags:
    - image-builder # Targets dedicated RHEL 9.8 VM Runner
  before_script:
    - sudo mkdir -p "${STATE_DIR}"
    - sudo chown -R gitlab-runner:gitlab-runner "${STATE_DIR}"
    - |
      if [ ! -f "${SECURE_TFVARS}" ]; then
        echo "CRITICAL ERROR: Local secure variables file ${SECURE_TFVARS} missing on Runner disk!"
        exit 1
      fi

# =========================================================================
#  STAGE 1: OPENTOFU ORCHESTRATION PLAN
# =========================================================================
tofu_plan:
  stage: plan
  extends: .tofu_base
  script:
    - 'echo "=== 1. INITIALIZING OPENTOFU ENVIRONMENT ==="'
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -w /workspace \
        ${TOFU_IMAGE} init

    - 'echo "=== 2. GENERATING INFRASTRUCTURE STATE MAP ==="'
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -v "${SECURE_TFVARS}":/workspace/terraform.tfvars:z \
        -w /workspace \
        ${TOFU_IMAGE} plan -out=tofu.plan
  artifacts:
    paths:
      - tofu.plan
      - .terraform.lock.hcl
    expire_in: 1 hour

# =========================================================================
# STAGE 2: OPENTOFU INFRASTRUCTURE DEPLOYMENT (STATELESS)
# =========================================================================
tofu_apply:
  stage: apply
  extends: .tofu_base
  dependencies:
    - tofu_plan
  script:
    - 'echo "=== 3. EXECUTING PROXMOX INSTANCE PROVISIONING ==="'
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -v "${SECURE_TFVARS}":/workspace/terraform.tfvars:z \
        -w /workspace \
        ${TOFU_IMAGE} apply -auto-approve tofu.plan
  artifacts:
    paths:
      # Pass the dynamic inventory file as an artifact to the Ansible stage
      - ansible-inventory/hosts.ini
    expire_in: 1 hour
  only:
    - main
  when: manual # Explicit human approval gate for production changes

# =========================================================================
#  STAGE 3: ANSIBLE APPLICATION PROVISIONING (ENCRYPTED VAULT)
# =========================================================================
ansible_configure:
  stage: configure
  tags:
    - image-builder # Runs locally on Runner shell to inherit native network SSH access
  dependencies:
    - tofu_apply # Inherits the hosts.ini file generated during the apply stage
  needs:
    - tofu_apply #  FORCE GITLAB TO WAIT FOR MANUAL APPLY SUCCESS BEFORE RUNNING
  before_script:
    - |
      if [ ! -f "${VAULT_PASS_FILE}" ]; then
        echo "CRITICAL ERROR: Isolated Ansible Vault password file ${VAULT_PASS_FILE} missing on Runner disk!"
        exit 1
      fi
      if [ ! -f "ansible-inventory/hosts.ini" ]; then
        echo "CRITICAL ERROR: Dynamic inventory hosts.ini artifact missing from OpenTofu stage!"
        exit 1
      fi
  script:
    - 'echo "=== 4. LAUNCHING AUTOMATED CONFIG-AS-CODE DISPATCH ==="'
    - cd ansible-openbao
    # Triggers Ansible with in-memory decryption using the server's local vault file
    - ansible-playbook -i ../ansible-inventory/hosts.ini site.yml --vault-password-file "${VAULT_PASS_FILE}"
  only:
    - main
