# =============================================================
# GITOPS PIPELINE: PURE STATELESS ROOTLESS PODMAN ORCHESTRATION
# =============================================================

stages:
  - plan
  - apply

variables:
  TOFU_IMAGE: "ghcr.io/opentofu/opentofu:1.8.4"
  STATE_DIR: "/var/lib/gitlab-runner/share/tofu-state"
  SECURE_DIR: "/var/lib/gitlab-runner/secure-vars"
  SECURE_TFVARS: "${SECURE_DIR}/production.tfvars"

.tofu_base:
  tags:
    - image-builder # Targeting dedicated RHEL Runner node
  before_script:
    - mkdir -p "${STATE_DIR}"
    - |
      if [ ! -f "${SECURE_TFVARS}" ]; then
        echo "CRITICAL ERROR: Local secure variables file ${SECURE_TFVARS} missing on Runner disk!"
        exit 1
      fi
  #Post-execution runtime remediation hook to guarantee workspace sanitization
  after_script:
    - 'echo "=== CLEANUP: Restoring workspace files permissions to gitlab-runner ==="'
    - 'chown -R gitlab-runner:gitlab-runner "${CI_PROJECT_DIR}"'

# ==================================================
# STAGE 1: OPENTOFU CRYPTOGRAPHIC ORCHESTRATION PLAN
# =================================================
tofu_plan:
  stage: plan
  extends: .tofu_base
  script:
    - 'echo "=== 1. INITIALIZING ROOTLESS OPENTOFU ENVIRONMENT ==="'
    # ROOTLESS STANDARD: Using :z,U to safely align SELinux context and User Ownership
    - |
      podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z,U \
        -v "${STATE_DIR}":/workspace/.terraform:z,U \
        -w /workspace \
        ${TOFU_IMAGE} init

    - 'echo "=== 2. GENERATING ZERO-TRUST INFRASTRUCTURE DELTA STATE MAP ==="'
    # Mounting the secure directory to /secure-vars:ro instead of a single file overlay
    - |
      podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z,U \
        -v "${STATE_DIR}":/workspace/.terraform:z,U \
        -v "${SECURE_DIR}":/secure-vars:ro \
        -w /workspace \
        ${TOFU_IMAGE} plan -var-file=terraform.tfvars -var-file=/secure-vars/production.tfvars -out=tofu.plan
  artifacts:
    paths:
      - tofu.plan
      - .terraform.lock.hcl
    expire_in: 1 hour

# =======================================================
# STAGE 2: OPENTOFU MATERIAL INFRASTRUCTURE PROVISIONING
# =======================================================
tofu_apply:
  stage: apply
  extends: .tofu_base
  dependencies:
    - tofu_plan
  script:
    - 'echo "=== 3. EXECUTING PROXMOX MATRICIAL DEPLOYMENT ==="'
    - |
      podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z,U \
        -v "${STATE_DIR}":/workspace/.terraform:z,U \
        -v "${SECURE_DIR}":/secure-vars:ro \
        -w /workspace \
        ${TOFU_IMAGE} apply -auto-approve tofu.plan
  artifacts:
    paths:
      # CRITICAL GITOPS BRIDGE: Exposing the dynamically compiled network inventory map as a pipeline artifact
      - ansible-inventory/hosts.ini
    expire_in: 24 hour
  only:
    - main
  when: manual # Human-in-the-loop sovereign gatekeeper approval gate

