stages:
  - plan
  - apply

variables:
  TOFU_IMAGE: "ghcr.io/opentofu/opentofu:1.8.4"
  STATE_DIR: "/var/lib/gitlab-runner/share/tofu-state"
  # Secure host path inside the Runner's dedicated partition
  SECURE_TFVARS: "/var/lib/gitlab-runner/secure-vars/production.tfvars"

.tofu_base:
  tags:
    - image-builder # Targets your dedicated RHEL 9.8 VM Runner
  before_script:
    - sudo mkdir -p "${STATE_DIR}"
    - sudo chown -R gitlab-runner:gitlab-runner "${STATE_DIR}"
    # Pre-flight check: ensure the secure credentials file exists locally on the host
    - |
      if [ ! -f "${SECURE_TFVARS}" ]; then
        echo "CRITICAL ERROR: Local secure variables file ${SECURE_TFVARS} missing on Runner disk!"
        exit 1
      fi

tofu_plan:
  stage: plan
  extends: .tofu_base
  script:
    - 'echo "=== 1. INITIALIZING OPENTOFU ENVIRONMENT ==="'
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -w /workspace \
        ${TOFU_IMAGE} init

    - 'echo "=== 2. GENERATING INFRASTRUCTURE PLAN VIA LOCAL TFVARS ==="'
    # Mounts the runner's local file as the container's active terraform.tfvars sheet
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -v "${SECURE_TFVARS}":/workspace/terraform.tfvars:z \
        -w /workspace \
        ${TOFU_IMAGE} plan -out=tofu.plan
  artifacts:
    paths:
      - tofu.plan
    expire_in: 1 hour

tofu_apply:
  stage: apply
  extends: .tofu_base
  dependencies:
    - tofu_plan
  script:
    - 'echo "=== 3. EXECUTING DEPLOYMENT TO PROXMOX VE CLUSTER ==="'
    # The deploy stage maps the exact same host target to guarantee atomic state replication
    - |
      sudo podman run --rm \
        -v "${CI_PROJECT_DIR}":/workspace:z \
        -v "${STATE_DIR}":/workspace/.terraform:z \
        -v "${SECURE_TFVARS}":/workspace/terraform.tfvars:z \
        -w /workspace \
        ${TOFU_IMAGE} apply -auto-approve tofu.plan
  only:
    - main
  when: manual # Human-in-the-loop validation gate requiring user approval in GitLab UI
